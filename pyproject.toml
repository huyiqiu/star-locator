[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star16-locator"
version = "2.0.0"
description = "Star16 infrared marker detection and planar pose estimation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.9,<5", "pydantic>=2.6,<3"]

[project.scripts]
star16 = "star16.cli:main"

[tool.setuptools.packages.find]
include = ["star16*"]
